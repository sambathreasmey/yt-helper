<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>YouTube Helper</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f0f0f;--card:#272727;--mut:#aaa;--tx:#fff;--red:#f00}
:root[data-theme=light]{--bg:#fff;--card:#f2f2f2;--mut:#606060;--tx:#0f0f0f}
*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 8px) 12px calc(var(--tg-safe-area-inset-bottom,0px) + 14px)}
.hide{display:none!important}
.ic{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
i{display:inline-flex}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header svg{width:44px;height:31px}
h1{font-size:20px;margin:0}
.user{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.uname{font-size:16px;font-weight:700;line-height:1.2}
.uhandle{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;padding:12px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
input::placeholder{color:var(--mut)}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
button.red,button.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
h2{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--mut);margin:16px 0 8px}
.item{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.item img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--card);flex:none}
.item span{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#pwrap{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:10px}
#pwrap iframe{width:100%;height:100%;border:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#ptitle{font-size:16px;margin:10px 0 0}
.note{color:var(--mut);font-size:13px}
#fav.star .ic{fill:#fc0;stroke:#fc0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></symbol>
<symbol id="i-shorts" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
<symbol id="i-fire" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4.1 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8M12 8v8"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
<symbol id="i-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="i-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
<symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
</defs></svg>

<div id="home">
  <header>
    <svg viewBox="0 0 110 78"><rect width="110" height="78" rx="20" fill="#f00"/><polygon points="44,22 44,56 74,39" fill="#fff"/></svg>
    <h1>YouTube Helper</h1>
  </header>
  <div class="user hide" id="user"><div class="av" id="av"></div><div><div class="uname" id="uname"></div><div class="uhandle" id="uhandle"></div></div></div>
  <div class="row" id="srow"><input id="q"><button class="red" id="sbtn"><i data-i="search"></i></button></div>
  <div class="row"><input id="link"><button class="red" id="pbtn"><i data-i="play"></i><b id="ptxt"></b></button></div>
  <div class="grid">
    <button data-go="https://m.youtube.com"><i data-i="play"></i>YouTube</button>
    <button data-go="https://m.youtube.com/shorts"><i data-i="shorts"></i>Shorts</button>
    <button data-go="https://m.youtube.com/feed/trending"><i data-i="fire"></i>Trending</button>
    <button id="a2hs"><i data-i="plus"></i>Home Screen</button>
  </div>
  <h2 id="favT"><i data-i="star"></i><span></span></h2><div id="favs"></div>
  <h2 id="hisT"><i data-i="clock"></i><span></span></h2><div id="hist"></div>
</div>

<div id="search" class="hide"><button id="sback"><i data-i="back"></i><b></b></button><div id="sres" style="margin-top:12px"></div></div>

<div id="player" class="hide">
  <button id="pback"><i data-i="back"></i><b></b></button>
  <div id="pwrap"><div id="yt"></div></div>
  <p id="ptitle"></p>
  <p class="note hide" id="err"></p>
  <div class="ctl">
    <button id="back10"><i data-i="ccw"></i>10s</button><button id="fwd10">10s<i data-i="cw"></i></button>
    <button id="speed">1x</button><button id="loop"><i data-i="loop"></i></button>
    <button id="fav"><i data-i="star"></i></button><button id="share"><i data-i="send"></i><b></b></button><button id="open"><i data-i="ext"></i></button>
  </div>
</div>

<script>
const tg = Telegram.WebApp;
const API_KEY = "";                    // optional: YouTube Data API key for in-app search
const $ = id => document.getElementById(id);
const km = (tg.initDataUnsafe?.user?.language_code === "km");
const T = km
  ? {s:"ស្វែងរកវីដេអូ",l:"បិទភ្ជាប់តំណ YouTube",p:"លេង",f:"ចូលចិត្ត",h:"ថ្មីៗ",sh:"ចែករំលែក",b:"ត្រឡប់ក្រោយ",e:"វីដេអូនេះមិនអាចលេងនៅទីនេះបានទេ សូមបើកក្នុង YouTube"}
  : {s:"Search videos",l:"Paste YouTube link",p:"Play",f:"Favorites",h:"Recent",sh:"Share",b:"Back",e:"This video can't be played here. Use the open button to watch it on YouTube."};

/* ---------- theme (dark / light) ---------- */
function applyTheme() {
  const t = tg.colorScheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = t;
  const c = t === "light" ? "#ffffff" : "#0f0f0f";
  ["setHeaderColor", "setBackgroundColor", "setBottomBarColor"].forEach(f => { try { tg[f](c); } catch (e) {} });
}
applyTheme();
try { tg.onEvent("themeChanged", applyTheme); } catch (e) {}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme); } catch (e) {}

/* icons */
document.querySelectorAll("i[data-i]").forEach(el => el.innerHTML = `<svg class="ic"><use href="#i-${el.dataset.i}"/></svg>`);

/* ---------- disable zoom ---------- */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTap = 0;
document.addEventListener("touchend", e => { const n = Date.now(); if (n - lastTap < 300) e.preventDefault(); lastTap = n; }, { passive: false });

const hap = t => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const lget = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const store = {
  get: k => new Promise(r => { try { tg.CloudStorage.getItem(k, (err, v) => r(!err && v ? JSON.parse(v) : lget(k))); } catch (e) { r(lget(k)); } }),
  set: (k, v) => { const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch (e) {} try { tg.CloudStorage.setItem(k, s); } catch (e) {} }
};

let hist = [], favs = [], cur = null, player = null, loop = false, pending = null;
const speeds = [1, 1.25, 1.5, 2, 0.5]; let si = 0;
const parseId = s => { s = s || ""; const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|[?&]v=)([\w-]{11})/) || (/^[\w-]{11}$/.test(s.trim()) ? [0, s.trim()] : null); return m ? m[1] : null; };

/* ---------- setup ---------- */
tg.ready(); tg.expand();
try { tg.requestFullscreen(); } catch (e) {}
try { tg.disableVerticalSwipes(); } catch (e) {}
$("q").placeholder = T.s; $("link").placeholder = T.l; $("ptxt").textContent = T.p;
document.querySelector("#favT span").textContent = T.f; document.querySelector("#hisT span").textContent = T.h;
document.querySelector("#share b").textContent = T.sh; document.querySelector("#sback b").textContent = T.b; document.querySelector("#pback b").textContent = T.b;
$("err").textContent = T.e;
if (!API_KEY) $("srow").classList.add("hide");
if (!tg.addToHomeScreen) $("a2hs").classList.add("hide");

/* ---------- Telegram profile ---------- */
(function () {
  const u = tg.initDataUnsafe?.user; if (!u) return;
  const name = [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || "";
  $("uname").textContent = name;
  $("uhandle").textContent = u.username ? "@" + u.username : "";
  const av = $("av");
  if (u.photo_url) {
    const img = new Image(); img.src = u.photo_url; img.alt = "";
    img.onerror = () => { av.textContent = (name[0] || "?").toUpperCase(); };
    av.replaceChildren(img);
  } else av.textContent = (name[0] || "?").toUpperCase();
  $("user").classList.remove("hide");
})();

/* ---------- views ---------- */
function show(v) {
  ["home", "search", "player"].forEach(x => $(x).classList.toggle("hide", x !== v));
  try { v === "home" ? tg.BackButton.hide() : tg.BackButton.show(); } catch (e) {}
  scrollTo(0, 0);
}
const home = () => { try { player.pauseVideo(); } catch (e) {} show("home"); renderLists(); };
try { tg.BackButton.onClick(home); } catch (e) {}
$("pback").onclick = $("sback").onclick = () => { hap(); home(); };

/* leaving for the real YouTube site: exit fullscreen first so nothing sits under the status bar */
const OPEN_MODE = "inapp";   // "inapp"   = YouTube opens inside the Mini App window (Helper stays in history, back swipe/button may return)
                             // "browser" = YouTube opens on top via Telegram's browser; closing it returns to Helper
function go(url) {
  hap();
  if (OPEN_MODE === "browser") { tg.openLink(url, { try_instant_view: false }); return; }
  try { tg.exitFullscreen(); } catch (e) {}
  setTimeout(() => location.assign(url), 250);   // assign (not replace) keeps Helper in the history
}
/* coming back to Helper from YouTube: restore fullscreen */
window.addEventListener("pageshow", e => { if (e.persisted) { try { tg.requestFullscreen(); } catch (x) {} applyTheme(); } });
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
$("a2hs").onclick = () => { hap(); try { tg.addToHomeScreen(); } catch (e) {} };

/* ---------- lists ---------- */
function item(v) {
  const d = document.createElement("div"); d.className = "item";
  d.innerHTML = `<img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><span></span>`;
  d.querySelector("span").textContent = v.t || v.id;
  d.onclick = () => play(v.id); return d;
}
function renderLists() {
  $("favs").replaceChildren(...favs.map(item)); $("hist").replaceChildren(...hist.map(item));
  $("favT").classList.toggle("hide", !favs.length); $("hisT").classList.toggle("hide", !hist.length);
}
async function titleOf(id) {
  try { const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://youtu.be/" + id)); return (await r.json()).title; }
  catch (e) { return id; }
}

/* ---------- player ---------- */
function mk(id) {
  if (player && player.loadVideoById) { player.loadVideoById(id); return; }
  if (!window.YT || !YT.Player) { pending = id; return; }
  player = new YT.Player("yt", {
    videoId: id, width: "100%", height: "100%",
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onStateChange: e => { if (e.data === 0 && loop) { player.seekTo(0); player.playVideo(); } },
      onError: () => $("err").classList.remove("hide")
    }
  });
}
window.onYouTubeIframeAPIReady = () => { if (pending) { const p = pending; pending = null; mk(p); } };
const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);

async function play(id) {
  hap(); cur = { id, t: id }; show("player"); $("err").classList.add("hide");
  $("ptitle").textContent = ""; mk(id); updFav();
  const t = await titleOf(id); cur.t = t; $("ptitle").textContent = t;
  hist = [{ id, t: t.slice(0, 50) }, ...hist.filter(v => v.id !== id)].slice(0, 20); store.set("hist", hist);
  if (favs.find(v => v.id === id)) { favs = favs.map(v => v.id === id ? { id, t: t.slice(0, 50) } : v); store.set("favs", favs); }
}
function updFav() { $("fav").classList.toggle("star", !!favs.find(v => v.id === cur.id)); }
$("fav").onclick = () => {
  hap("medium");
  favs = favs.find(v => v.id === cur.id) ? favs.filter(v => v.id !== cur.id) : [{ id: cur.id, t: (cur.t || cur.id).slice(0, 50) }, ...favs].slice(0, 20);
  store.set("favs", favs); updFav();
};
$("speed").onclick = () => { hap(); si = (si + 1) % speeds.length; try { player.setPlaybackRate(speeds[si]); } catch (e) {} $("speed").textContent = speeds[si] + "x"; };
$("loop").onclick = () => { hap(); loop = !loop; $("loop").classList.toggle("on", loop); };
$("back10").onclick = () => { hap(); try { player.seekTo(player.getCurrentTime() - 10, true); } catch (e) {} };
$("fwd10").onclick = () => { hap(); try { player.seekTo(player.getCurrentTime() + 10, true); } catch (e) {} };
$("share").onclick = () => { hap(); tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent("https://youtu.be/" + cur.id) + "&text=" + encodeURIComponent(cur.t || "")); };
$("open").onclick = () => { hap(); tg.openLink("https://youtu.be/" + cur.id); };

$("pbtn").onclick = () => { const id = parseId($("link").value); if (id) { $("link").value = ""; play(id); } else hap("heavy"); };

/* ---------- search (needs API_KEY) ---------- */
async function doSearch() {
  const q = $("q").value.trim(); if (!q || !API_KEY) return;
  hap(); show("search"); $("sres").textContent = "...";
  try {
    const r = await fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=" + encodeURIComponent(q) + "&key=" + API_KEY);
    const j = await r.json();
    $("sres").replaceChildren(...(j.items || []).map(i => item({ id: i.id.videoId, t: i.snippet.title })));
  } catch (e) { $("sres").textContent = "Error"; }
}
$("sbtn").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

/* ---------- start ---------- */
(async () => {
  hist = (await store.get("hist")) || []; favs = (await store.get("favs")) || [];
  renderLists();
  const deep = parseId(new URLSearchParams(location.search).get("v")) || parseId(tg.initDataUnsafe?.start_param);
  if (deep) play(deep);
})();
</script>
</body>
</html>
